<!DOCTYPE html>
<html lang="en">

<div id="fallback">VAULTLINE needs a browser with Canvas 2D support. Try a recent desktop Chrome, Edge or Firefox.</div>
<script>
"use strict";
/* ============================================================
   VAULTLINE — Night at the Meridian
   An original top-down bank-heist game in one HTML file.
   Vanilla JS + Canvas 2D. All art drawn with code, all sound
   synthesized with WebAudio. Zero network requests at runtime.
   ============================================================ */

// ----------------------------- utils -----------------------------
const TAU = Math.PI * 2;
const clamp = (v, a, b) => v < a ? a : (v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const rand = (a, b) => a + Math.random() * (b - a);
const randi = (a, b) => Math.floor(rand(a, b + 1));
const pick = arr => arr[Math.floor(Math.random() * arr.length)];
const dist2 = (x1, y1, x2, y2) => { const dx = x2 - x1, dy = y2 - y1; return dx * dx + dy * dy; };
const dist = (x1, y1, x2, y2) => Math.sqrt(dist2(x1, y1, x2, y2));
function angDiff(a, b) { let d = (b - a) % TAU; if (d > Math.PI) d -= TAU; if (d < -Math.PI) d += TAU; return d; }
function angLerp(a, b, t) { return a + angDiff(a, b) * t; }
function circleRect(cx, cy, r, rx, ry, rw, rh) {
  const nx = clamp(cx, rx, rx + rw), ny = clamp(cy, ry, ry + rh);
  return dist2(cx, cy, nx, ny) < r * r;
}
function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16);
  const r = clamp(Math.round(((n >> 16) & 255) * f), 0, 255);
  const g = clamp(Math.round(((n >> 8) & 255) * f), 0, 255);
  const b = clamp(Math.round((n & 255) * f), 0, 255);
  return "rgb(" + r + "," + g + "," + b + ")";
}
function segRectHit(x1, y1, x2, y2, r) { // segment vs AABB (slab test); returns t in [0,1] or -1
  const dx = x2 - x1, dy = y2 - y1;
  let tmin = 0, tmax = 1;
  if (Math.abs(dx) < 1e-9) { if (x1 < r.x || x1 > r.x + r.w) return -1; }
  else {
    let t1 = (r.x - x1) / dx, t2 = (r.x + r.w - x1) / dx;
    if (t1 > t2) { const t = t1; t1 = t2; t2 = t; }
    tmin = Math.max(tmin, t1); tmax = Math.min(tmax, t2); if (tmin > tmax) return -1;
  }
  if (Math.abs(dy) < 1e-9) { if (y1 < r.y || y1 > r.y + r.h) return -1; }
  else {
    let t1 = (r.y - y1) / dy, t2 = (r.y + r.h - y1) / dy;
    if (t1 > t2) { const t = t1; t1 = t2; t2 = t; }
    tmin = Math.max(tmin, t1); tmax = Math.min(tmax, t2); if (tmin > tmax) return -1;
  }
  return tmin;
}

// ----------------------------- audio -----------------------------
const AudioSys = {
  ctx: null, master: null, muted: false, alarmOsc: null, alarmGain: null, sirenOsc: null, sirenGain: null,
  init() {
    if (this.ctx) { if (this.ctx.state === "suspended") this.ctx.resume(); return; }
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      this.ctx = new AC();
      this.master = this.ctx.createGain(); this.master.gain.value = 0.5;
      this.master.connect(this.ctx.destination);
      // alarm klaxon (two-tone via LFO on frequency)
      this.alarmOsc = this.ctx.createOscillator(); this.alarmOsc.type = "square"; this.alarmOsc.frequency.value = 620;
      const lfo = this.ctx.createOscillator(); lfo.type = "square"; lfo.frequency.value = 1.4;
      const lfoG = this.ctx.createGain(); lfoG.gain.value = 140;
      lfo.connect(lfoG); lfoG.connect(this.alarmOsc.frequency);
      this.alarmGain = this.ctx.createGain(); this.alarmGain.gain.value = 0;
      const af = this.ctx.createBiquadFilter(); af.type = "lowpass"; af.frequency.value = 1600;
      this.alarmOsc.connect(af); af.connect(this.alarmGain); this.alarmGain.connect(this.master);
      this.alarmOsc.start(); lfo.start();
      // police siren (sweep)
      this.sirenOsc = this.ctx.createOscillator(); this.sirenOsc.type = "triangle"; this.sirenOsc.frequency.value = 800;
      const slfo = this.ctx.createOscillator(); slfo.type = "sine"; slfo.frequency.value = 0.35;
      const slfoG = this.ctx.createGain(); slfoG.gain.value = 260;
      slfo.connect(slfoG); slfoG.connect(this.sirenOsc.frequency);
      this.sirenGain = this.ctx.createGain(); this.sirenGain.gain.value = 0;
      this.sirenOsc.connect(this.sirenGain); this.sirenGain.connect(this.master);
      this.sirenOsc.start(); slfo.start();
    } catch (e) { this.ctx = null; }
  },
  tone(freq, dur, type, vol, slideTo, delay) {
    if (!this.ctx || this.muted) return;
    const t = this.ctx.currentTime + (delay || 0);
    const o = this.ctx.createOscillator(), g = this.ctx.createGain();
    o.type = type || "sine"; o.frequency.setValueAtTime(freq, t);
    if (slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(20, slideTo), t + dur);
    g.gain.setValueAtTime(vol || 0.2, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(this.master); o.start(t); o.stop(t + dur + 0.02);
  },
  noise(dur, vol, freq, delay) {
    if (!this.ctx || this.muted) return;
    const t = this.ctx.currentTime + (delay || 0);
    const len = Math.max(1, (dur * this.ctx.sampleRate) | 0);
    const buf = this.ctx.createBuffer(1, len, this.ctx.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
    const src = this.ctx.createBufferSource(); src.buffer = buf;
    const f = this.ctx.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = freq || 1800;
    const g = this.ctx.createGain(); g.gain.value = vol || 0.25;
    src.connect(f); f.connect(g); g.connect(this.master); src.start(t);
  },
  click() { this.tone(880, 0.05, "square", 0.06); },
  step(sprint) { this.noise(0.05, sprint ? 0.10 : 0.05, 700); },
  coin() { this.tone(1560, 0.07, "sine", 0.14); this.tone(2090, 0.12, "sine", 0.10, null, 0.05); },
  cash() { this.tone(1318, 0.09, "sine", 0.16); this.tone(1760, 0.22, "sine", 0.16, null, 0.09); },
  clunk() { this.tone(90, 0.22, "sine", 0.5, 45); this.noise(0.12, 0.2, 500); },
  tumbler() { this.tone(2400, 0.04, "square", 0.08); },
  good() { this.tone(784, 0.1, "sine", 0.18); this.tone(1046, 0.16, "sine", 0.18, null, 0.09); },
  bad() { this.tone(196, 0.25, "sawtooth", 0.16, 130); },
  drill() { this.noise(0.3, 0.28, 900); this.tone(70, 0.3, "sawtooth", 0.10, 55); },
  zap() { this.noise(0.18, 0.22, 3200); this.tone(1400, 0.15, "sawtooth", 0.10, 200); },
  thud() { this.tone(65, 0.18, "sine", 0.45, 40); },
  sting(win) {
    if (win) { [523, 659, 784, 1046].forEach((f, i) => this.tone(f, 0.22, "triangle", 0.2, null, i * 0.11)); }
    else { [392, 330, 262, 196].forEach((f, i) => this.tone(f, 0.3, "triangle", 0.2, null, i * 0.14)); }
  },
  setLoops(alarmOn, sirenLevel) {
    if (!this.ctx) return;
    const t = this.ctx.currentTime;
    this.alarmGain.gain.setTargetAtTime(!this.muted && alarmOn ? 0.045 : 0, t, 0.15);
    this.sirenGain.gain.setTargetAtTime(!this.muted ? clamp(sirenLevel, 0, 1) * 0.05 : 0, t, 0.3);
  }
};

// ----------------------------- input -----------------------------
const keys = {};
const mouse = { x: 0, y: 0, down: false, clicked: false };
window.addEventListener("keydown", e => {
  if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight", "Space"].includes(e.code)) e.preventDefault();
  keys[e.code] = true; AudioSys.init();
  onKeyPress(e.code);
});
window.addEventListener("keyup", e => { keys[e.code] = false; });
window.addEventListener("contextmenu", e => e.preventDefault());
const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");
if (!ctx) document.getElementById("fallback").style.display = "block";

// Logical resolution: the whole bank fits in one 960x640 frame.
const W = 960, H = 640;
canvas.width = W; canvas.height = H;
function fitCanvas() {
  const s = Math.min(window.innerWidth / W, window.innerHeight / H);
  canvas.style.width = Math.floor(W * s) + "px";
  canvas.style.height = Math.floor(H * s) + "px";
}
window.addEventListener("resize", fitCanvas); fitCanvas();
canvas.addEventListener("mousemove", e => {
  const r = canvas.getBoundingClientRect();
  mouse.x = (e.clientX - r.left) * (W / r.width);
  mouse.y = (e.clientY - r.top) * (H / r.height);
});
canvas.addEventListener("mousedown", e => { if (e.button === 0) { mouse.down = true; mouse.clicked = true; AudioSys.init(); } });
window.addEventListener("mouseup", () => { mouse.down = false; });
// ----------------------------- bank layout -----------------------------
// One-screen bank. Walls are AABBs; doors are gaps + door objects.
const WALLS = [];        // {x,y,w,h} solid, blocks movement + sight
const FURN = [];         // {x,y,w,h,type} furniture; solid ones block movement, tall ones block sight
const DOORS = [];        // {x,y,w,h,open,locked,lockpickT,name,horiz}
function wall(x, y, w, h) { WALLS.push({ x, y, w, h }); }
function furn(x, y, w, h, type, solid, tall) { FURN.push({ x, y, w, h, type, solid: !!solid, tall: !!tall }); }
function door(x, y, w, h, locked, name, horiz) {
  const d = { x, y, w, h, open: false, locked: !!locked, lockpickT: 0, name: name || "Door", horiz: !!horiz };
  DOORS.push(d); return d;
}
function buildLayout() {
  WALLS.length = 0; FURN.length = 0; DOORS.length = 0;
  const T = 10; // wall thickness
  // --- outer shell: street strip at bottom (y 560..640), alley at top-right ---
  wall(0, 0, 960, T);                       // top
  wall(0, 0, T, 560);                       // left
  wall(950, 0, T, 560);                     // right
  wall(0, 550, 400, T); wall(560, 550, 400, T); // front wall with glass-door gap 400..560
  // --- vault room (top-right): x 700..950, y 10..180 ---
  wall(700, 10, T, 120); wall(700, 170, 60, T); wall(800, 170, 150, T); // left wall + bottom with door gap 760..800
  // --- vault antechamber / laser corridor: x 700..950, y 180..250 ---
  wall(700, 180, T, 70);
  // --- security room: x 520..700, y 10..150 ---
  wall(520, 10, T, 90); wall(520, 140, 110, T); wall(670, 140, 30, T); // door gap 630..670
  // --- manager office: x 10..230, y 10..160 ---
  wall(230, 10, T, 100); wall(10, 160, 140, T); wall(190, 160, 40, T); // door gap 150..190
  // --- office 2: x 240..420, y 10..160 ---
  wall(420, 10, T, 100); wall(240, 160, 120, T); wall(400, 160, 20, T); // door gap 360..400
  // --- janitor closet: x 430..520, y 10..120 ---
  wall(430, 120, 40, T); wall(510, 120, 10, T); // door gap 470..510
  // --- mid corridor wall (y=300) separating offices from lobby, with 3 gaps ---
  wall(10, 300, 180, T); wall(230, 300, 240, T); wall(510, 300, 220, T); wall(770, 300, 180, T);
  // gaps at 190..230, 470..510, 730..770
  // --- teller counter wall (y=430) with 2 gaps ---
  wall(120, 430, 200, T); wall(360, 430, 240, T); wall(640, 430, 200, T);
  // gaps at 320..360, 600..640
  // --- back-alley door (top-right corner, leads outside to alley van) ---
  // (gap cut in top wall at x 860..900)
  WALLS[0] = { x: 0, y: 0, w: 860, h: T }; WALLS.push({ x: 900, y: 0, w: 60, h: T });

  // doors
  door(760, 166, 40, 18, true, "Vault door", true);          // antechamber -> vault (keycard/lockpick)
  door(630, 136, 40, 18, true, "Security door", true);       // corridor -> security room
  door(150, 156, 40, 18, false, "Manager office", true);
  door(360, 156, 40, 18, false, "Office", true);
  door(470, 116, 40, 18, false, "Janitor closet", true);
  door(860, -4, 40, 18, false, "Alley door", true);          // back exit
  door(400, 546, 160, 18, false, "Front doors", true);       // glass front (always passable when open)

  // --- furniture ---
  // lobby: waiting chairs, plants, info desk
  furn(60, 470, 90, 26, "chairs", true, false); furn(810, 470, 90, 26, "chairs", true, false);
  furn(30, 350, 26, 26, "plant", true, true); furn(904, 350, 26, 26, "plant", true, true);
  furn(455, 470, 50, 30, "desk", true, false);
  furn(200, 360, 40, 24, "plant", true, true); furn(720, 360, 40, 24, "plant", true, true);
  // teller counters (cover)
  furn(140, 405, 160, 22, "counter", true, false); furn(380, 405, 220, 22, "counter", true, false); furn(660, 405, 160, 22, "counter", true, false);
  // behind-counter desks
  furn(160, 330, 60, 26, "desk", true, false); furn(430, 330, 60, 26, "desk", true, false); furn(700, 330, 60, 26, "desk", true, false);
  // manager office: big desk + safe + bookshelf
  furn(30, 40, 110, 34, "bigdesk", true, false); furn(170, 30, 44, 44, "safe", true, true); furn(30, 110, 80, 20, "shelf", true, true);
  // office 2: desks + cabinet
  furn(270, 40, 80, 30, "desk", true, false); furn(270, 100, 80, 30, "desk", true, false); furn(380, 30, 26, 60, "cabinet", true, true);
  // janitor closet: shelves + mop bucket
  furn(440, 30, 70, 18, "shelf", true, true); furn(440, 70, 26, 26, "bucket", false, false);
  // security room: console desk + server racks
  furn(545, 30, 130, 30, "console", true, false); furn(545, 90, 26, 40, "server", true, true); furn(655, 90, 26, 40, "server", true, true);
  // vault room: loot tables
  furn(730, 40, 90, 30, "loottable", true, false); furn(840, 40, 90, 30, "loottable", true, false); furn(785, 110, 90, 30, "loottable", true, false);
  // corridor plants (hide spots)
  furn(250, 200, 26, 26, "plant", true, true); furn(660, 200, 26, 26, "plant", true, true);
}
const SOLIDS = () => {
  const s = WALLS.slice();
  for (const f of FURN) if (f.solid) s.push(f);
  for (const d of DOORS) if (!d.open) s.push(d);
  return s;
};
const SIGHT_BLOCKERS = () => {
  const s = WALLS.slice();
  for (const f of FURN) if (f.tall) s.push(f);
  for (const d of DOORS) if (!d.open) s.push(d);
  return s;
};
function losClear(x1, y1, x2, y2) {
  const blockers = SIGHT_BLOCKERS();
  for (const b of blockers) { const t = segRectHit(x1, y1, x2, y2, b); if (t >= 0 && t < 1) return false; }
  return true;
}
function rayDist(x, y, ang, maxD) {
  const x2 = x + Math.cos(ang) * maxD, y2 = y + Math.sin(ang) * maxD;
  let best = maxD;
  for (const b of SIGHT_BLOCKERS()) { const t = segRectHit(x, y, x2, y2, b); if (t >= 0) best = Math.min(best, t * maxD); }
  return best;
}
function collide(e, nx, ny) {
  // circle vs solids, axis-separated slide
  const solids = SOLIDS();
  let x = nx, y = e.y;
  for (const s of solids) if (circleRect(x, y, e.r, s.x, s.y, s.w, s.h)) { x = e.x; break; }
  y = ny;
  for (const s of solids) if (circleRect(x, y, e.r, s.x, s.y, s.w, s.h)) { y = e.y; break; }
  e.x = clamp(x, e.r + 2, W - e.r - 2); e.y = clamp(y, e.r + 2, H - e.r - 2);
}

// ----------------------------- game state -----------------------------
const LOADOUT_ITEMS = [
  { id: "picks", name: "Lockpick set", desc: "Pick locked doors (slow, quiet)" },
  { id: "jammer", name: "Camera jammer", desc: "Loop cameras from anywhere (1 use)" },
  { id: "smoke", name: "Smoke bomb", desc: "Break line of sight (1 use, key X)" },
  { id: "baton", name: "Stun baton", desc: "Silent takedowns from behind (F)" },
  { id: "duffel", name: "Extra duffel", desc: "+20 kg loot capacity" }
];
const ENTRIES = [
  { id: "front", name: "Front doors", desc: "Walk in off the street. Exposed, but the van is right there.", x: 480, y: 585 },
  { id: "alley", name: "Back alley", desc: "Slip in by the vault side. Quiet, far from the van.", x: 880, y: 26 },
  { id: "vent", name: "Roof vent", desc: "Drop into the manager's office. Keycard is close.", x: 120, y: 90 }
];
const G = {
  mode: "title",           // title | plan | play | pause | win | busted
  time: 0,                 // run clock (seconds, play only)
  attractT: 0,
  entry: 0, loadout: [true, false, false, true, false], // default: picks + baton
  alarm: 0,                // 0..100 alarm meter
  alarmOn: false,          // alarm triggered
  policeETA: -1,           // seconds until police arrive (-1 = not coming)
  policeHere: false,
  seen: false,             // ever fully spotted
  lootValue: 0, lootWeight: 0, maxWeight: 40,
  hasKeycard: false,
  camsLooped: 0,           // seconds remaining
  lasersOn: true,
  vaultOpen: false, vaultCracking: false,
  objective: 0,
  banner: null, toast: null,
  shake: 0,
  best: 0, bestRank: ""
};
try {
  G.best = parseInt(localStorage.getItem("vaultline_best") || "0", 10) || 0;
  G.bestRank = localStorage.getItem("vaultline_rank") || "";
} catch (e) { /* storage unavailable */ }

const player = {
  x: 480, y: 585, r: 10, angle: -Math.PI / 2, speed: 0,
  crouch: false, sprint: false, stepT: 0, walkPhase: 0,
  channel: null,        // {label, t, dur, onDone}
  coins: 3, smoke: 0, jammerUsed: false
};
let guards = [], cameras = [], loot = [], particles = [], floaters = [], coinsThrown = [];
let janitor = null, vanZone = null, alleyVanZone = null;
let vault = { x: 830, y: 95, r: 34, state: "locked", openT: 0 }; // locked|cracking|opening|open
let crack = null; // mini-game state {needle, dir, tumblers, zoneC, zoneW}
let lasers = [];  // {x1,y1,x2,y2,on,phase}
let interactables = [];
let smokeClouds = [];

function hasItem(id) { const i = LOADOUT_ITEMS.findIndex(l => l.id === id); return i >= 0 && G.loadout[i]; }
function banner(title, sub) { G.banner = { title, sub: sub || "", t: 3.2 }; }
function toast(text) { G.toast = { text, t: 2.6 }; }
function floater(x, y, text, color) { floaters.push({ x, y, text, color: color || "#ffd166", t: 1.4 }); }
function burst(x, y, n, color, spd, life) {
  for (let i = 0; i < n; i++) {
    const a = rand(0, TAU), s = rand(spd * 0.3, spd);
    particles.push({ x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(life * 0.5, life), maxLife: life, color, size: rand(1.5, 3.5) });
  }
}
function makeNoise(x, y, radius) {
  for (const g of guards) {
    if (g.state === "down") continue;
    if (dist(g.x, g.y, x, y) < radius) {
      if (g.state === "patrol" || g.state === "search") { g.state = "investigate"; g.tx = x; g.ty = y; g.stateT = 0; }
    }
  }
}

function resetRun() {
  buildLayout();
  G.time = 0; G.alarm = 0; G.alarmOn = false; G.policeETA = -1; G.policeHere = false;
  G.seen = false; G.lootValue = 0; G.lootWeight = 0; G.hasKeycard = false;
  G.camsLooped = 0; G.lasersOn = true; G.vaultOpen = false; G.vaultCracking = false;
  G.objective = 0; G.banner = null; G.toast = null; G.shake = 0;
  G.maxWeight = hasItem("duffel") ? 60 : 40;
  const e = ENTRIES[G.entry];
  player.x = e.x; player.y = e.y; player.angle = e.id === "alley" ? Math.PI / 2 : -Math.PI / 2;
  player.channel = null; player.coins = 3; player.smoke = hasItem("smoke") ? 1 : 0; player.jammerUsed = false;
  vault = { x: 830, y: 95, r: 34, state: "locked", openT: 0 };
  crack = null; particles = []; floaters = []; coinsThrown = []; smokeClouds = [];
  guards = [
    { x: 480, y: 480, r: 10, angle: 0, speed: 62, state: "patrol", wp: 0, stateT: 0, seeT: 0, tx: 0, ty: 0, lastX: 0, lastY: 0,
      path: [[480, 480], [140, 480], [140, 370], [480, 370], [820, 370], [820, 480]], color: "#3d5a80", flash: true },
    { x: 330, y: 230, r: 10, angle: Math.PI, speed: 58, state: "patrol", wp: 0, stateT: 0, seeT: 0, tx: 0, ty: 0, lastX: 0, lastY: 0,
      path: [[330, 230], [120, 230], [120, 90], [330, 90], [330, 230], [600, 230]], color: "#3d5a80", flash: true },
    { x: 780, y: 215, r: 10, angle: Math.PI / 2, speed: 55, state: "patrol", wp: 0, stateT: 0, seeT: 0, tx: 0, ty: 0, lastX: 0, lastY: 0,
      path: [[780, 215], [890, 215], [890, 260], [730, 260]], color: "#3d5a80", flash: true }
  ];
  cameras = [
    { x: 480, y: 318, base: Math.PI / 2, sweep: 0.85, phase: 0, range: 150, half: 0.42, name: "Lobby cam" },
    { x: 205, y: 318, base: -Math.PI / 2, sweep: 0.7, phase: 2, range: 140, half: 0.42, name: "Corridor cam" },
    { x: 825, y: 258, base: -Math.PI / 2, sweep: 0.9, phase: 4, range: 140, half: 0.42, name: "Vault cam" },

function canSee(gx, gy, gAng, range, half, px, py) {
  const d = dist(gx, gy, px, py);

  const ang = Math.atan2(py - gy, px - gx);
  if (Math.abs(angDiff(gAng, ang)) > half && d > 26) return 0;
  if (!losClear(gx, gy, px, py)) return 0;
  // smoke blocks sight
  for (const s of smokeClouds) if (dist(s.x, s.y, px, py) < s.r) return 0;
  return clamp(1 - d / range, 0.15, 1); // visibility strength 0..1
}
function playerVisibility() {
  let v = 1;
  if (player.crouch) v *= 0.55;
  if (player.sprint) v *= 1.5;

  for (const f of FURN) {
    if (f.tall && dist(player.x, player.y, f.x + f.w / 2, f.y + f.h / 2) < Math.max(f.w, f.h) / 2 + 16) { v *= 0.35; break; }

}

    ctx.lineTo(x + Math.cos(a) * d, y + Math.sin(a) * d);

}

  const pulse = 0.65 + 0.35 * Math.sin(G.attractT * 3);
  ctx.globalAlpha = pulse; ctx.fillStyle = "#ffd166"; ctx.font = "bold 20px Segoe UI";
  ctx.fillText("PRESS ENTER TO PLAN THE JOB", W / 2, 372);
  ctx.globalAlpha = 1;
  ctx.font = "13px Segoe UI"; ctx.fillStyle = "#9fb2cc";
  ctx.fillText("WASD move · Shift sprint (loud) · C crouch · E interact · Q throw coin · F takedown · X smoke · J jammer", W / 2, 420);
  ctx.fillText("Stay out of the cones. The alarm meter is your life. Loot is heavy — choose well.", W / 2, 442);
  if (G.best > 0) {
    ctx.fillStyle = "#ffd166"; ctx.font = "bold 14px Segoe UI";
    ctx.fillText("BEST SCORE: $" + G.best.toLocaleString() + "  (Rank " + G.bestRank + ")", W / 2, 486);
  }
}
const planButtons = []; // {x,y,w,h,action}
function drawPlan() {
  // blueprint background
  ctx.fillStyle = "#0a1a33"; ctx.fillRect(0, 0, W, H);
  ctx.strokeStyle = "rgba(120,170,255,0.10)"; ctx.lineWidth = 1;
  for (let x = 0; x < W; x += 24) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, H); ctx.stroke(); }
  for (let y = 0; y < H; y += 24) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(W, y); ctx.stroke(); }
  planButtons.length = 0;
  ctx.textAlign = "center";
  ctx.fillStyle = "#ffd166"; ctx.font = "bold 30px Georgia, serif";
  ctx.fillText("THE PLAN — MERIDIAN BANK, 2:47 AM", W / 2, 42);
  // floor plan (scaled 0.62, offset)
  const s = 0.62, ox = 40, oy = 64;
  ctx.save(); ctx.translate(ox, oy); ctx.scale(s, s);
  ctx.fillStyle = "rgba(30,60,110,0.5)"; ctx.fillRect(0, 0, W, 560);
  ctx.strokeStyle = "#8ecae6"; ctx.lineWidth = 2;
  for (const w of WALLS) ctx.strokeRect(w.x, w.y, w.w, w.h);
  // guard patrols (dashed)
  ctx.setLineDash([8, 7]); ctx.strokeStyle = "#ffd166"; ctx.lineWidth = 2;
  for (const g of guards) {
    ctx.beginPath();
    g.path.forEach((p, i) => i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]));
    ctx.closePath(); ctx.stroke();
  }
  ctx.setLineDash([]);
  // camera cones
  for (const c of cameras) drawCone(c.x, c.y, c.base, c.range, c.half, "#ffd166", 0.20);
  // vault + keycard + vans
  ctx.fillStyle = "#ffd700"; ctx.beginPath(); ctx.arc(vault.x, vault.y, 20, 0, TAU); ctx.fill();
  ctx.fillStyle = "#0a1a33"; ctx.font = "bold 15px Segoe UI"; ctx.fillText("$", vault.x, vault.y + 5);
  ctx.fillStyle = "#8ecae6"; ctx.fillRect(78, 52, 14, 10);
  ctx.fillStyle = "#28418c"; ctx.fillRect(vanZone.x, vanZone.y, vanZone.w, vanZone.h);
  ctx.fillStyle = "#28418c"; ctx.fillRect(alleyVanZone.x, alleyVanZone.y, alleyVanZone.w, alleyVanZone.h);
  // entry markers
  ENTRIES.forEach((e, i) => {
    ctx.fillStyle = G.entry === i ? "#38f2a6" : "#ffd166";
    ctx.beginPath(); ctx.arc(e.x, e.y, 13, 0, TAU); ctx.fill();
    ctx.fillStyle = "#0a1a33"; ctx.font = "bold 13px Segoe UI"; ctx.fillText(String(i + 1), e.x, e.y + 4.5);
  });
  ctx.restore();
  ctx.fillStyle = "#9fb2cc"; ctx.font = "11px Segoe UI"; ctx.textAlign = "left";
  ctx.fillText("— walls   - - guard patrols   cones = cameras   $ = vault   blue = vans", ox, oy + 560 * s + 18);
  // right panel: entry + loadout
  const px = 660;
  ctx.fillStyle = "rgba(10,20,40,0.85)"; ctx.fillRect(px - 12, 64, 300, 470);
  ctx.strokeStyle = "#2b4a7a"; ctx.strokeRect(px - 11.5, 64.5, 299, 469);
  ctx.fillStyle = "#ffd166"; ctx.font = "bold 15px Segoe UI"; ctx.textAlign = "left";
  ctx.fillText("ENTRY POINT", px, 92);
  ENTRIES.forEach((e, i) => {
    const y = 104 + i * 52;
    const sel = G.entry === i;
    ctx.fillStyle = sel ? "#1d3a24" : "#12233f"; ctx.fillRect(px, y, 276, 44);
    ctx.strokeStyle = sel ? "#38f2a6" : "#2b4a7a"; ctx.strokeRect(px + 0.5, y + 0.5, 275, 43);
    ctx.fillStyle = sel ? "#38f2a6" : "#dfe7f5"; ctx.font = "bold 13px Segoe UI";
    ctx.fillText((i + 1) + ". " + e.name, px + 10, y + 18);
    ctx.font = "10.5px Segoe UI"; ctx.fillStyle = "#9fb2cc";
    ctx.fillText(e.desc, px + 10, y + 34);
    planButtons.push({ x: px, y, w: 276, h: 44, action: () => { G.entry = i; AudioSys.click(); } });
  });
  ctx.fillStyle = "#ffd166"; ctx.font = "bold 15px Segoe UI";
  ctx.fillText("LOADOUT — pick 2", px, 288);
  LOADOUT_ITEMS.forEach((it, i) => {
    const y = 300 + i * 38;
    const sel = G.loadout[i];
    ctx.fillStyle = sel ? "#3a2f10" : "#12233f"; ctx.fillRect(px, y, 276, 32);
    ctx.strokeStyle = sel ? "#ffd166" : "#2b4a7a"; ctx.strokeRect(px + 0.5, y + 0.5, 275, 31);
    ctx.fillStyle = sel ? "#ffd166" : "#dfe7f5"; ctx.font = "bold 12px Segoe UI";
    ctx.fillText((sel ? "✓ " : "· ") + it.name, px + 10, y + 14);
    ctx.font = "10px Segoe UI"; ctx.fillStyle = "#9fb2cc";
    ctx.fillText(it.desc, px + 10, y + 27);
    planButtons.push({ x: px, y, w: 276, h: 32, action: () => {
      if (sel) { G.loadout[i] = false; }
      else if (G.loadout.filter(Boolean).length >= 2) { toast("Only 2 tools — drop one first"); AudioSys.bad(); return; }
      else G.loadout[i] = true;
      AudioSys.click();
    } });
  });
  // start button
  const sy = 548;
  ctx.fillStyle = "#7a1f2b"; ctx.fillRect(px, sy, 276, 52);
  ctx.strokeStyle = "#ffd166"; ctx.lineWidth = 2; ctx.strokeRect(px + 1, sy + 1, 274, 50);
  ctx.fillStyle = "#ffd166"; ctx.font = "bold 20px Georgia, serif"; ctx.textAlign = "center";
  ctx.fillText("START THE JOB", px + 138, sy + 34);
  planButtons.push({ x: px, y: sy, w: 276, h: 52, action: () => { resetRun(); G.mode = "play"; banner("THE JOB IS ON", "Objective: " + OBJECTIVES[0]); AudioSys.good(); } });
  ctx.textAlign = "left"; ctx.font = "11px Segoe UI"; ctx.fillStyle = "#9fb2cc";
  ctx.fillText("Keys 1-3 entry · Enter start", px, sy + 70);
  if (G.toast) {
    ctx.globalAlpha = clamp(G.toast.t, 0, 1);
    ctx.fillStyle = "#ffd166"; ctx.font = "bold 13px Segoe UI"; ctx.textAlign = "center";
    ctx.fillText(G.toast.text, W / 2, H - 14);
    ctx.globalAlpha = 1;
  }
}
function drawEnd(win) {
  drawWorld();
  ctx.fillStyle = win ? "rgba(6,20,12,0.72)" : "rgba(24,6,10,0.72)"; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = "center";
  ctx.fillStyle = win ? "#38f2a6" : "#ff3355"; ctx.font = "bold 56px Georgia, serif";
  ctx.fillText(win ? "CLEAN GETAWAY" : "BUSTED", W / 2, 170);
  ctx.fillStyle = "#dfe7f5"; ctx.font = "16px Segoe UI";
  if (win) {
    let y = 220;
    const line = (label, val, color) => {
      ctx.fillStyle = "#9fb2cc"; ctx.textAlign = "right"; ctx.fillText(label, W / 2 - 12, y);
      ctx.fillStyle = color || "#ffd166"; ctx.textAlign = "left"; ctx.fillText(val, W / 2 + 12, y);
      y += 26;
    };
    line("Loot hauled", "$" + G.lootValue.toLocaleString() + "  (" + G.lootWeight + " kg)");
    line("Ghost bonus (never seen)", G.seen ? "—" : "+$5,000", G.seen ? "#5a6a86" : "#38f2a6");
    line("Silent bonus (no alarm)", G.alarmOn ? "—" : "+$3,000", G.alarmOn ? "#5a6a86" : "#38f2a6");
    line("Speed bonus", "+$" + Math.max(0, Math.floor((240 - G.time) * 10)).toLocaleString());
    line("Time", fmtTime(G.time), "#dfe7f5");
    y += 8;
    ctx.textAlign = "center"; ctx.fillStyle = "#ffd166"; ctx.font = "bold 26px Segoe UI";
    ctx.fillText("SCORE $" + (G.score || 0).toLocaleString(), W / 2, y);
    ctx.font = "bold 40px Georgia, serif"; ctx.fillStyle = "#ffd700";
    ctx.fillText("RANK " + G.rank, W / 2, y + 48);
  } else {
    ctx.fillText(G.endReason || "The job went sideways.", W / 2, 220);
    ctx.fillText("Loot lost: $" + G.lootValue.toLocaleString() + " · Survived " + fmtTime(G.time), W / 2, 248);
  }
  ctx.fillStyle = "#9fb2cc"; ctx.font = "14px Segoe UI";
  ctx.fillText("ENTER — plan another job        R — retry same plan", W / 2, 470);
  if (G.best > 0) { ctx.fillStyle = "#ffd166"; ctx.fillText("BEST: $" + G.best.toLocaleString() + " (Rank " + G.bestRank + ")", W / 2, 498); }
}
function drawPause() {
  drawWorld(); drawHUD();
  ctx.fillStyle = "rgba(4,8,20,0.7)"; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = "center"; ctx.fillStyle = "#ffd166"; ctx.font = "bold 40px Georgia, serif";
  ctx.fillText("PAUSED", W / 2, 280);
  ctx.fillStyle = "#dfe7f5"; ctx.font = "15px Segoe UI";
  ctx.fillText("P / Esc — resume      R — restart job      M — " + (AudioSys.muted ? "unmute" : "mute"), W / 2, 320);
  ctx.font = "13px Segoe UI"; ctx.fillStyle = "#9fb2cc";
  ctx.fillText("WASD move · Shift sprint · C crouch · E interact · Q coin · F takedown · X smoke · J jammer", W / 2, 352);
}

// ----------------------------- keys -----------------------------
function onKeyPress(code) {
  if (code === "KeyM") { AudioSys.muted = !AudioSys.muted; return; }
  if (G.mode === "title") {
    if (code === "Enter" || code === "Space") { G.mode = "plan"; AudioSys.click(); }
    return;
  }
  if (G.mode === "plan") {
    if (code === "Digit1") G.entry = 0;
    if (code === "Digit2") G.entry = 1;
    if (code === "Digit3") G.entry = 2;
    if (code === "Enter") { resetRun(); G.mode = "play"; banner("THE JOB IS ON", "Objective: " + OBJECTIVES[0]); AudioSys.good(); }
    return;
  }
  if (G.mode === "win" || G.mode === "busted") {
    if (code === "Enter") { G.mode = "plan"; resetRun(); }
    if (code === "KeyR") { resetRun(); G.mode = "play"; banner("THE JOB IS ON", "Objective: " + OBJECTIVES[0]); }
    return;
  }
  if (G.mode === "pause") {
    if (code === "KeyP" || code === "Escape") G.mode = "play";
    if (code === "KeyR") { resetRun(); G.mode = "play"; }
    return;
  }
  // play mode
  if (code === "KeyP" || code === "Escape") { G.mode = "pause"; AudioSys.setLoops(false, 0); return; }
  if (crack && (code === "Space")) { crackAttempt(); return; }
  if (code === "KeyE") doInteract(nearestInteractable());
  if (code === "KeyQ") {
    if (player.coins > 0) {
      player.coins--;
      const a = Math.atan2(mouse.y - player.y, mouse.x - player.x);
      coinsThrown.push({ x: player.x, y: player.y, vx: Math.cos(a) * 260, vy: Math.sin(a) * 260, t: 0, landed: false });
      AudioSys.coin();
    } else toast("Out of coins");
  }
  if (code === "KeyX") {
    if (player.smoke > 0) {
      player.smoke--;
      smokeClouds.push({ x: player.x, y: player.y, r: 74, t: 6 });
      burst(player.x, player.y, 16, "#c8cddc", 70, 0.7); AudioSys.noise(0.4, 0.2, 1200);
      for (const g of guards) if (g.state === "chase") { g.state = "search"; g.tx = player.x; g.ty = player.y; g.stateT = 0; g.seeT = 0; }
    } else toast("No smoke bomb");
  }
  if (code === "KeyJ") {
    if (hasItem("jammer") && !player.jammerUsed) {
      player.jammerUsed = true; G.camsLooped = 60; AudioSys.zap();
      banner("JAMMER ACTIVE", "Cameras blind for 60 seconds");
    } else if (!hasItem("jammer")) toast("No jammer in loadout");
    else toast("Jammer spent");
  }
  if (code === "KeyF") {
    // takedown: nearest guard within 30px, from behind (or any angle with baton)
    let best = null, bd = 34;
    for (const g of guards) {
      if (g.state === "down") continue;
      const d = dist(player.x, player.y, g.x, g.y);
      if (d < bd) { bd = d; best = g; }
    }
    if (best) {
      const behind = Math.abs(angDiff(best.angle, Math.atan2(player.y - best.y, player.x - best.x))) > 1.9;
      if (behind || hasItem("baton")) {
        best.state = "down"; AudioSys.thud(); burst(best.x, best.y, 8, "#dfe7f5", 50, 0.5);
        floater(best.x, best.y - 18, "DOWN", "#8ecae6");
      } else { toast("He's facing you — get behind him"); AudioSys.bad(); }
    }
  }
  if (code === "KeyR") { resetRun(); banner("THE JOB IS ON", "Objective: " + OBJECTIVES[0]); }
}

// ----------------------------- main loop -----------------------------
let lastT = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  let dt = (now - lastT) / 1000; lastT = now;
  dt = clamp(dt, 0, 0.05);
  if (mouse.clicked) {
    mouse.clicked = false;
    if (G.mode === "plan") {
      for (const b of planButtons) {
        if (mouse.x >= b.x && mouse.x <= b.x + b.w && mouse.y >= b.y && mouse.y <= b.y + b.h) { b.action(); break; }
      }
    } else if (G.mode === "play" && crack) crackAttempt();
    else if (G.mode === "title") { G.mode = "plan"; AudioSys.click(); }
  }
  update(dt);
  ctx.save();
  if (G.shake > 0) ctx.translate(rand(-G.shake, G.shake), rand(-G.shake, G.shake));
  if (G.mode === "title") drawTitle();
  else if (G.mode === "plan") drawPlan();
  else if (G.mode === "pause") drawPause();
  else if (G.mode === "win") drawEnd(true);
  else if (G.mode === "busted") drawEnd(false);
  else { drawWorld(); drawHUD(); }
  ctx.restore();
}
buildLayout();
resetRun();
renderFloor();
requestAnimationFrame(frame);
</script>
</body>
