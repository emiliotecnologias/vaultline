/* ---------------- utils ---------------- */
const clamp = (v,a,b)=> v<a?a : v>b?b : v;
const lerp = (a,b,t)=> a + (b-a)*t;
const dist = (x1,y1,x2,y2)=> Math.hypot(x2-x1, y2-y1);
const rand = (a,b)=> a + Math.random()*(b-a);
function angNorm(a){ while(a>Math.PI) a-=Math.PI*2; while(a<-Math.PI) a+=Math.PI*2; return a; }
function angDiff(a,b){ return angNorm(a-b); }
function inRect(x,y,r){ return x>=r.x && x<=r.x+r.w && y>=r.y && y<=r.y+r.h; }
function circleRect(cx,cy,cr,r){
  const nx = clamp(cx, r.x, r.x+r.w), ny = clamp(cy, r.y, r.y+r.h);
  const dx = cx-nx, dy = cy-ny;
  return dx*dx + dy*dy < cr*cr;
}
/* Ray vs AABB (slab method). Returns distance t along unit dir, or Infinity. */
function rayRect(ox,oy,dx,dy,r){
  let tmin = 0, tmax = Infinity;
  if (Math.abs(dx) < 1e-9){ if (ox < r.x || ox > r.x+r.w) return Infinity; }
  else {
    let t1 = (r.x-ox)/dx, t2 = (r.x+r.w-ox)/dx;
    if (t1 > t2){ const t=t1; t1=t2; t2=t; }
    tmin = Math.max(tmin,t1); tmax = Math.min(tmax,t2);
    if (tmin > tmax) return Infinity;
  }
  if (Math.abs(dy) < 1e-9){ if (oy < r.y || oy > r.y+r.h) return Infinity; }
  else {
    let t1 = (r.y-oy)/dy, t2 = (r.y+r.h-oy)/dy;
    if (t1 > t2){ const t=t1; t1=t2; t2=t; }
    tmin = Math.max(tmin,t1); tmax = Math.min(tmax,t2);
    if (tmin > tmax) return Infinity;
  }
  return tmin;
}
function losClear(x1,y1,x2,y2,blockers){
  const dx = x2-x1, dy = y2-y1, d = Math.hypot(dx,dy);
  if (d < 1) return true;
  const nx = dx/d, ny = dy/d;
  for (const r of blockers){ if (rayRect(x1,y1,nx,ny,r) < d-2) return false; }
  return true;
}
function segPointDist(x1,y1,x2,y2,px,py){
  const dx=x2-x1, dy=y2-y1, L2=dx*dx+dy*dy;
  let t = L2 ? ((px-x1)*dx + (py-y1)*dy)/L2 : 0;
  t = clamp(t,0,1);
  return dist(px,py, x1+dx*t, y1+dy*t);
}
function fmt$(n){ return '$' + n.toLocaleString('en-US'); }

/* ---------------- audio (all synthesized) ---------------- */
let AC = null, master = null;
function audioInit(){
  if (AC) return;
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain();
    master.gain.value = G.muted ? 0 : 0.5;
    master.connect(AC.destination);
  } catch(e){ AC = null; }
}
function tone(f, dur, type, vol, slide, delay){
  if (!AC || G.muted) return;
  type = type || 'sine'; vol = vol || 0.18; delay = delay || 0;
  const t0 = AC.currentTime + delay;
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f, t0);
  if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, f+slide), t0+dur);
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(0.001, t0+dur);
  o.connect(g); g.connect(master);
  o.start(t0); o.stop(t0+dur+0.02);
}
function noiseBurst(dur, vol, freq, delay){
  if (!AC || G.muted) return;
  delay = delay || 0;
  const len = Math.max(1, (AC.sampleRate*dur)|0);
  const buf = AC.createBuffer(1, len, AC.sampleRate);
  const d = buf.getChannelData(0);
  for (let i=0;i<len;i++) d[i] = Math.random()*2-1;
  const src = AC.createBufferSource(); src.buffer = buf;
  const f = AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value = freq || 1000;
  const g = AC.createGain();
  const t0 = AC.currentTime + delay;
  g.gain.setValueAtTime(vol, t0);
  g.gain.exponentialRampToValueAtTime(0.001, t0+dur);
  src.connect(f); f.connect(g); g.connect(master);
  src.start(t0);
}

/* ---------------- collision & sight ---------------- */
function moveBlockers(){
  const out = WALLS.slice();
  for (const f of FURN) out.push(f);
  for (const d of DOORS) if (!d.open) out.push(d);
  if (!G.vaultOpen) out.push(VAULT_DOOR);
  return out;
}
function sightBlockers(crouched){
  const out = WALLS.slice();
  for (const d of DOORS) if (!d.open) out.push(d);
  if (!G.vaultOpen) out.push(VAULT_DOOR);
  if (crouched) for (const f of FURN) if (f.tall) out.push(f);
  return out;
}
function collideMove(e, dx, dy, blockers){
  /* axis-separated circle vs AABB */
  let nx = e.x + dx;
  let hit = false;
  for (const r of blockers) if (circleRect(nx, e.y, e.r, r)){ hit = true; break; }
  if (!hit) e.x = nx;
  let ny = e.y + dy;
  hit = false;
  for (const r of blockers) if (circleRect(e.x, ny, e.r, r)){ hit = true; break; }
  if (!hit) e.y = ny;
  e.x = clamp(e.x, e.r+2, W-e.r-2);
  e.y = clamp(e.y, e.r+2, H-e.r-2);
}
function inSmoke(x,y){
  return G.smokeT > 0 && dist(x,y,G.smokeX,G.smokeY) < 95;
}
function canSee(ox,oy,ang,range,fov){
  const p = G.player;
  const d = dist(ox,oy,p.x,p.y);
  if (d > range) return 0;
  const toP = Math.atan2(p.y-oy, p.x-ox);
  if (Math.abs(angDiff(toP, ang)) > fov/2) return 0;
  if (inSmoke(p.x,p.y)) return 0;
  if (!losClear(ox,oy,p.x,p.y, sightBlockers(p.crouch))) return 0;
  return 1 - d/range; /* 0..1 closeness */
}

/* ---------------- feedback ---------------- */
function floater(x,y,text,color){
  G.floaters.push({x,y,text,color:color||'#ffd94d',t:0});
}
function burst(x,y,color,n){
  for (let i=0;i<(n||10);i++){
    G.particles.push({x,y,vx:rand(-70,70),vy:rand(-90,20),t:0,life:rand(.3,.8),color});
  }
}
function setMsg(m){ G.msg = m; G.msgT = 3.2; }
function makeNoise(x,y,radius){
  for (const g of G.guards){
    if (g.down) continue;
    if (dist(x,y,g.x,g.y) <= radius && g.state !== 'chase'){
      g.state = 'investigate'; g.tx = x; g.ty = y; g.lookT = 0;
    }
  }
}
function raiseAlarm(amount){
  if (G.alarmOn) return;
  G.alarm = clamp(G.alarm + amount, 0, 100);
  if (G.alarm >= 100){
    G.alarmOn = true; G.alarmEver = true; G.police = 60;
    setMsg('ALARM TRIGGERED — police en route!');
    SFX.alarmBeep();
  }
}

/* ---------------- input ---------------- */
const keys = new Set();
const mouse = {x:W/2, y:H/2};
cv.addEventListener('mousemove', e=>{
  const r = cv.getBoundingClientRect();
  mouse.x = (e.clientX - r.left) * (W / r.width);
  mouse.y = (e.clientY - r.top) * (H / r.height);
});
cv.addEventListener('click', e=>{
  audioInit();
  const r = cv.getBoundingClientRect();
  const mx = (e.clientX - r.left) * (W / r.width);
  const my = (e.clientY - r.top) * (H / r.height);
  if (G.mode === 'plan') planClick(mx,my);
  else if (G.mode === 'play' && G.dial) dialStop();
});
window.addEventListener('keydown', e=>{
  const k = e.key;
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(k)) e.preventDefault();
  audioInit();
  if (e.repeat){ keys.add(k.toLowerCase()); return; }
  keys.add(k.toLowerCase());

  if (k === 'm' || k === 'M'){
    G.muted = !G.muted;
    if (master) master.gain.value = G.muted ? 0 : 0.5;
    setMsg(G.muted ? 'Sound off' : 'Sound on');
    return;
  }

  if (G.mode === 'title'){
    if (k === 'Enter' || k === ' '){ G.mode = 'plan'; SFX.click(); }
    return;
  }
  if (G.mode === 'plan'){
    if (k === '1') G.entry = 0;
    else if (k === '2') G.entry = 1;
    else if (k === '3') G.entry = 2;
    else {
      const item = LOADOUT.find(l => l.key === k.toUpperCase());
      if (item) toggleLoadout(item.id);
      else if (k === 'Enter'){ startJob(); }
    }
    return;
  }
  if (G.mode === 'win' || G.mode === 'busted'){
    if (k === 'Enter' || k === 'r' || k === 'R'){ G.mode = 'plan'; SFX.click(); }
    return;
  }
  if (G.mode === 'play'){
    if (k === 'p' || k === 'P' || k === 'Escape'){ G.paused = !G.paused; SFX.click(); return; }
    if (G.paused) return;
    if (k === 'r' || k === 'R'){ G.mode = 'plan'; return; }
    if (G.dial){
      if (k === ' ') dialStop();
      return;
    }
    if (k === 'c' || k === 'C' || k === 'Control'){ G.player.crouch = !G.player.crouch; SFX.tick(); }
    else if (k === 'q' || k === 'Q') throwCoin();
    else if (k === 'f' || k === 'F') tryTakedown();
    else if (k === 'x' || k === 'X') useSmoke();
    else if (k === 'j' || k === 'J') useJammer();
    else if (k === 'e' || k === 'E') interactPress();
  }
});
window.addEventListener('keyup', e=>{ keys.delete(e.key.toLowerCase()); });

function toggleLoadout(id){
  if (G.loadout.has(id)){ G.loadout.delete(id); SFX.click(); }
  else if (G.loadout.size < 2){ G.loadout.add(id); SFX.click(); }
  else { SFX.tick(); setMsg('Pick exactly 2 — unpick one first'); }
}
function startJob(){
  if (G.loadout.size !== 2){ setMsg('Pick exactly 2 loadout items'); SFX.tick(); return; }
  resetRun();
  G.mode = 'play';
  SFX.door();
  setMsg('The job is on. Stay invisible.');
}

/* ---------------- actions ---------------- */
function throwCoin(){
  if (G.coins <= 0){ setMsg('Out of coins'); return; }
  if (G.coinProj) return;
  G.coins--;
  const p = G.player;
  const a = Math.atan2(mouse.y - p.y, mouse.x - p.x);
  G.coinProj = {x:p.x, y:p.y, vx:Math.cos(a)*320, vy:Math.sin(a)*320, t:0};
}
function useSmoke(){
  if (!G.loadout.has('smoke') || G.smokeLeft <= 0){ setMsg('No smoke bomb'); return; }
  G.smokeLeft--; G.smokeT = 4.5; G.smokeX = G.player.x; G.smokeY = G.player.y;
  SFX.smoke(); burst(G.player.x, G.player.y, '#cfd6e4', 16);
  setMsg('Smoke out — move!');
}
function useJammer(){
  if (!G.loadout.has('jammer')){ setMsg('No camera jammer in loadout'); return; }
  if (G.jamT > 0){ setMsg('Jammer already running'); return; }
  if (G.jammerUsed){ setMsg('Jammer spent'); return; }
  G.jammerUsed = true; G.jamT = 60;
  SFX.jam(); setMsg('Cameras blind for 60s');
}
function tryTakedown(){
  const p = G.player;
  let best = null, bd = 30;
  for (const g of G.guards){
    if (g.down) continue;
    const d = dist(p.x,p.y,g.x,g.y);
    if (d < bd){ bd = d; best = g; }
  }
  if (!best){ setMsg('No guard in reach'); return; }
  const toThief = Math.atan2(p.y-best.y, p.x-best.x);
  const behind = Math.abs(angDiff(toThief, best.ang)) > 2.0;
  if (behind || G.loadout.has('baton')){
    best.down = true; best.state = 'down';
    SFX.thud(); burst(best.x, best.y, '#9fb4ff', 10);
    floater(best.x, best.y-18, 'DOWN', '#9fb4ff');
  } else {
    setMsg('Too risky — get behind him, or bring the baton');
    SFX.tick();
  }
}

/* interact: find what E would act on right now */
function nearestInteract(){
  const p = G.player;
  /* vault door */
  if (!G.vaultOpen && G.vaultSwing <= 0 && !G.dial){
    const cx = VAULT_DOOR.x + VAULT_DOOR.w/2, cy = VAULT_DOOR.y + VAULT_DOOR.h/2;
    if (dist(p.x,p.y,cx,cy) < 46) return {kind:'vault', label:'Crack the vault dial'};
  }
  /* loot */
  if (G.vaultOpen){
    for (const l of LOOT){
      if (!l.taken && dist(p.x,p.y,l.x,l.y) < 26) return {kind:'loot', item:l, label:'Grab ' + lootName(l)};
    }
  }
  /* doors */
  for (const d of DOORS){
    const cx = d.x + d.w/2, cy = d.y + d.h/2;
    if (dist(p.x,p.y,cx,cy) < 34){
      if (d.open) return {kind:'door', door:d, label:'Close the door'};
      if (!d.locked) return {kind:'door', door:d, label:'Open the door'};
      if (d.keycard && G.hasKeycard) return {kind:'door', door:d, label:'Swipe the keycard'};
      if (G.loadout.has('lockpick')) return {kind:'pick', door:d, label:'Pick the lock', time:3};
      return {kind:'blocked', door:d, label: d.keycard ? 'Locked — needs the keycard' : 'Locked — no lockpicks'};
    }
  }
  /* channel interactables */
  for (const it of INTERACT){
    if (it.done) continue;
    if (dist(p.x,p.y,it.x,it.y) < it.r) return {kind:'channel', item:it, label:it.label, time:it.time};
  }
  return null;
}
function lootName(l){ return l.kind==='gold' ? 'gold bar' : l.kind==='cash' ? 'cash brick' : 'gem case'; }

function interactPress(){
  const t = nearestInteract();
  if (!t) return;
  if (t.kind === 'vault'){ startDial(); return; }
  if (t.kind === 'loot'){
    const l = t.item;
    if (G.weight + l.kg > G.capacity){ setMsg('Duffel full! (' + G.weight + '/' + G.capacity + ' kg)'); SFX.tick(); return; }
    l.taken = true; G.weight += l.kg; G.money += l.value; G.lootCount++;
    SFX.cash(); burst(l.x, l.y, '#ffd94d', 12);
    floater(l.x, l.y-14, '+' + fmt$(l.value) + ' (' + l.kg + 'kg)', '#ffd94d');
    return;
  }
  if (t.kind === 'door'){
    t.door.open = !t.door.open;
    SFX.door();
    return;
  }
  if (t.kind === 'blocked'){ setMsg(t.label); SFX.tick(); return; }
  /* pick / channel start on hold — handled in update via E held */
}

function completeChannel(ch){
  if (ch.kind === 'pick'){
    ch.door.locked = false; ch.door.open = true;
    SFX.pick(); SFX.door(); floater(G.player.x, G.player.y-20, 'LOCK PICKED', '#9fe8a9');
    return;
  }
  const it = ch.item;
  it.done = true;
  if (it.id === 'keycard'){
    G.hasKeycard = true; SFX.cash();
    floater(it.x, it.y-16, 'KEYCARD STOLEN', '#9fe8a9');
    setMsg('Keycard in hand — the security room is open to you');
  } else if (it.id === 'console'){
    G.camsLooped = true; SFX.jam();
    floater(it.x, it.y-16, 'CAMERAS LOOPED', '#9fe8a9');
    setMsg('Every camera is playing last night\'s tape');
  } else if (it.id === 'alarmPanel'){
    G.alarmOn = false; G.alarm = 0; G.police = 0; SFX.clunk();
    floater(it.x, it.y-16, 'ALARM DISABLED', '#9fe8a9');
    setMsg('Alarm dead. The night is yours again');
  } else if (it.id === 'laserSwitch'){
    G.lasersOff = true; SFX.clunk();
    floater(it.x, it.y-16, 'LASERS OFF', '#9fe8a9');
    setMsg('Laser grid powered down');
  }
}

/* ---------------- vault dial minigame ---------------- */
function startDial(){
  G.dial = { tumbler:0, needle:rand(0,Math.PI*2), zoneStart:rand(0,Math.PI*2),
             sizes:[1.15, 0.85, 0.6], speeds:[2.1, 2.7, 3.3] };
  SFX.clunk();
  setMsg('Stop the needle in the green — 3 tumblers');
}
function dialStop(){
  const d = G.dial; if (!d) return;
  const n = ((d.needle % (Math.PI*2)) + Math.PI*2) % (Math.PI*2);
  const zs = ((d.zoneStart % (Math.PI*2)) + Math.PI*2) % (Math.PI*2);
  let rel = n - zs; if (rel < 0) rel += Math.PI*2;
  if (rel <= d.sizes[d.tumbler]){
    d.tumbler++; SFX.clunk();
    burst(G.player.x, G.player.y-10, '#9fe8a9', 8);
    if (d.tumbler >= 3){
      G.dial = null; G.vaultSwing = 6;
      setMsg('The vault door is swinging open — loud!');
      makeNoise(VAULT_DOOR.x+30, VAULT_DOOR.y+5, 260);
    } else {
      d.zoneStart = rand(0, Math.PI*2);
      floater(G.player.x, G.player.y-24, 'TUMBLER ' + d.tumbler + '/3', '#9fe8a9');
    }
  } else {
    SFX.clang(); G.shake = 6;
    raiseAlarm(18);
    floater(G.player.x, G.player.y-24, 'CLANG!', '#ff6b6b');
  }
}

/* ---------------- update ---------------- */
function update(dt){
  G.time += dt;
  if (G.msgT > 0) G.msgT -= dt;
  /* particles & floaters always tick */
  for (let i=G.particles.length-1;i>=0;i--){
    const p = G.particles[i]; p.t += dt;
    p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 160*dt;
    if (p.t > p.life) G.particles.splice(i,1);
  }
  for (let i=G.floaters.length-1;i>=0;i--){
    const f = G.floaters[i]; f.t += dt; f.y -= 22*dt;
    if (f.t > 1.4) G.floaters.splice(i,1);
  }
  if (G.mode === 'title'){ updateGuards(dt, true); updateCams(dt); return; }
  if (G.mode !== 'play' || G.paused) return;

  G.runTime += dt;
  if (G.shake > 0) G.shake = Math.max(0, G.shake - dt*14);
  if (G.smokeT > 0) G.smokeT -= dt;
  if (G.jamT > 0) G.jamT -= dt;

  updatePlayer(dt);
  updateCoin(dt);
  updateGuards(dt, false);
  updateCams(dt);
  updateLasers(dt);
  updateChannel(dt);

  if (G.dial){
    const d = G.dial;
    d.needle += d.speeds[d.tumbler] * dt;
    if (Math.random() < dt*6) SFX.tick();
  }
  if (G.vaultSwing > 0){
    G.vaultSwing -= dt;
    raiseAlarm(3.5*dt);
    if (G.vaultSwing <= 0){
      G.vaultOpen = true; G.shake = 10; SFX.vaultOpen();
      setMsg('Vault open — grab what you can carry');
      burst(VAULT_DOOR.x+30, VAULT_DOOR.y+5, '#ffd94d', 24);
    }
  }

  /* alarm decay when unseen */
  if (!G.alarmOn && !G.anySeen) G.alarm = Math.max(0, G.alarm - 5*dt);
  /* police */
  if (G.alarmOn){
    G.police -= dt;
    G.klaxonT -= dt;
    if (G.klaxonT <= 0){ SFX.alarmBeep(); G.klaxonT = 0.9; }
    if (G.police < 12 && G.police > 0){
      G.sirenT -= dt;
      if (G.sirenT <= 0){ SFX.siren(); G.sirenT = 1.1; }
    }
    if (G.police <= 0){ busted('The police arrived.'); return; }
  }
  /* win check */
  for (const v of VANS){
    if (inRect(G.player.x, G.player.y, v)){
      if (G.money > 0){ win(); return; }
      else if (G.msgT <= 0) setMsg('No loot yet — the van waits.');
    }
  }
}

function updatePlayer(dt){
  const p = G.player;
  if (G.dial){ p.moving = false; return; }
  let dx = 0, dy = 0;
  if (keys.has('a') || keys.has('arrowleft')) dx -= 1;
  if (keys.has('d') || keys.has('arrowright')) dx += 1;
  if (keys.has('w') || keys.has('arrowup')) dy -= 1;
  if (keys.has('s') || keys.has('arrowdown')) dy += 1;
  const len = Math.hypot(dx,dy);
  p.moving = len > 0;
  p.sprint = (keys.has('shift')) && !p.crouch && p.moving;
  if (p.moving){
    dx/=len; dy/=len;
    let speed = p.crouch ? 78 : p.sprint ? 218 : 138;
    speed *= (1 - 0.35 * (G.weight / G.capacity));
    collideMove(p, dx*speed*dt, dy*speed*dt, moveBlockers());
    p.ang = Math.atan2(dy,dx);
    G.channel = null; /* moving breaks channels */
    G.stepT -= dt * (p.sprint ? 2.2 : 1);
    if (G.stepT <= 0){
      G.stepT = p.crouch ? 0.55 : 0.34;
      if (!p.crouch) p.sprint ? SFX.stepLoud() : SFX.step();
      if (p.sprint) makeNoise(p.x, p.y, 135);
      else if (!p.crouch) makeNoise(p.x, p.y, 26);
    }
  }
}

function updateCoin(dt){
  const c = G.coinProj; if (!c) return;
  c.t += dt;
  const blockers = moveBlockers();
  let hit = false;
  for (const r of blockers) if (circleRect(c.x + c.vx*dt, c.y + c.vy*dt, 3, r)){ hit = true; break; }
  if (!hit){ c.x += c.vx*dt; c.y += c.vy*dt; }
  if (hit || c.t > 0.85){
    SFX.coin();
    floater(c.x, c.y-10, 'clink', '#cfd6e4');
    makeNoise(c.x, c.y, 190);
    G.coinProj = null;
  }
}

function updateChannel(dt){
  const eHeld = keys.has('e');
  if (!eHeld || G.player.moving || G.dial){ if (!eHeld) G.channel = null; return; }
  const t = nearestInteract();
  if (!t || (t.kind !== 'pick' && t.kind !== 'channel')){ G.channel = null; return; }
  if (!G.channel || G.channel.kind !== t.kind || G.channel.door !== t.door || G.channel.item !== t.item){
    G.channel = {kind:t.kind, door:t.door, item:t.item, t:0, dur:t.time, label:t.label};
  }
  G.channel.t += dt;
  if (Math.random() < dt*8) SFX.pick();
  if (G.channel.t >= G.channel.dur){
    completeChannel(G.channel);
    G.channel = null;
  }
}

function guardMove(g, tx, ty, speed, dt, blockers){
  const d = dist(g.x,g.y,tx,ty);
  if (d < 6) return true;
  const a = Math.atan2(ty-g.y, tx-g.x);
  g.ang = a;
  const ox = g.x, oy = g.y;
  collideMove(g, Math.cos(a)*speed*dt, Math.sin(a)*speed*dt, blockers);
  /* guards open unlocked doors they bump into */
  for (const dr of DOORS){
    if (!dr.open && !dr.locked && dist(g.x,g.y,dr.x+dr.w/2,dr.y+dr.h/2) < 26){ dr.open = true; SFX.door(); }
  }
  const moved = dist(g.x,g.y,ox,oy);
  if (moved < speed*dt*0.25){ g.stuckT += dt; } else g.stuckT = 0;
  return false;
}

function updateGuards(dt, attract){
  const blockers = moveBlockers();
  let anySeen = false;
  for (const g of G.guards){
    if (g.down) continue;
    g.r = 10;
    let seen = 0;
    if (!attract){
      seen = canSee(g.x, g.y, g.ang, 185, 1.05);
      if (seen > 0){
        anySeen = true;
        G.seenEver = true;
        raiseAlarm((18 + 40*seen) * (G.player.crouch ? 0.55 : 1) * dt);
        g.state = 'chase'; g.lastX = G.player.x; g.lastY = G.player.y; g.loseT = 0;
      }
      /* body discovery */
      if (!g.bodySeen){
        for (const o of G.guards){
          if (o !== g && o.down && dist(g.x,g.y,o.x,o.y) < 150 &&
              losClear(g.x,g.y,o.x,o.y, sightBlockers(false))){
            g.bodySeen = true;
            raiseAlarm(30);
            floater(o.x, o.y-18, 'MAN DOWN!', '#ff6b6b');
            g.state = 'investigate'; g.tx = o.x; g.ty = o.y;
            break;
          }
        }
      }
      /* chase contact = busted */
      if (g.state === 'chase' && dist(g.x,g.y,G.player.x,G.player.y) < 19){
        busted('A guard grabbed you.'); return;
      }
    }
    switch(g.state){
      case 'patrol': {
        const wp = g.path[g.wp];
        if (guardMove(g, wp[0], wp[1], 72, dt, blockers) || g.stuckT > 1.2){
          g.wp = (g.wp+1) % g.path.length; g.stuckT = 0;
        }
        break;
      }
      case 'investigate': {
        if (guardMove(g, g.tx, g.ty, 112, dt, blockers) || g.stuckT > 1.2){
          g.lookT += dt; g.ang += dt*1.6;
          if (g.lookT > 2.2){ g.state = 'patrol'; g.lookT = 0; g.stuckT = 0; }
        }
        break;
      }
      case 'search': {
        if (guardMove(g, g.lastX, g.lastY, 118, dt, blockers) || g.stuckT > 1.2){
          g.lookT += dt; g.ang += dt*2.2;
          if (g.lookT > 4){ g.state = 'patrol'; g.lookT = 0; g.stuckT = 0; }
        }
        break;
      }
      case 'chase': {
        if (seen === 0) g.loseT += dt;
        guardMove(g, g.lastX, g.lastY, 156, dt, blockers);
        if (g.loseT > 2.5 || g.stuckT > 1.6){ g.state = 'search'; g.lookT = 0; g.stuckT = 0; }
        break;
      }
    }
  }
  G.anySeen = anySeen;
}

function updateCams(dt){
  let anySeen = G.anySeen || false;
  for (const c of G.cams){
    c.ang = c.base + Math.sin(G.time*0.55 + c.phase) * c.sweep;
    if (G.mode !== 'play') continue;
    if (G.camsLooped || G.jamT > 0) continue;
    const seen = canSee(c.x, c.y, c.ang, c.range, c.fov);
    if (seen > 0){
      anySeen = true;
      G.seenEver = true;
      raiseAlarm((10 + 22*seen) * (G.player.crouch ? 0.55 : 1) * dt);
    }
  }
  G.anySeen = anySeen;
}

function updateLasers(dt){
  if (G.lasersOff) return;
  const p = G.player;
  for (const l of LASERS){
    if (l.cool > 0) l.cool -= dt;
    const active = ((G.time + l.phase) % 3.5) < 2.0;
    if (active && l.cool <= 0 && segPointDist(l.x1,l.y1,l.x2,l.y2,p.x,p.y) < 9){
      l.cool = 2.5;
      SFX.buzz(); raiseAlarm(32);
      floater(p.x, p.y-22, 'LASER TRIPPED!', '#ff6b6b');
      G.shake = Math.max(G.shake, 4);
    }
  }
}

function win(){
  G.mode = 'win';
  const ghost = G.seenEver ? 0 : 5000;
  const silent = G.alarmEver ? 0 : 3000;
  const speed = Math.max(0, Math.round((300 - G.runTime) * 10));
  G.scoreParts = {loot:G.money, ghost, silent, speed};
  G.score = G.money + ghost + silent + speed;
  G.rank = G.score >= 35000 ? 'S' : G.score >= 22000 ? 'A' : G.score >= 10000 ? 'B' : 'C';
  if (G.score > G.best){ G.best = G.score; saveBest(G.best); }
  SFX.win();
}
function busted(reason){
  if (G.mode !== 'play') return;
  G.mode = 'busted'; G.bustReason = reason;
  SFX.bust();
}

function objective(){
  const p = G.player;
  const inside = p.x > 80 && p.x < 880 && p.y > 70 && p.y < 550;
  if (!inside) return 'Get inside the Meridian';
  if (!G.hasKeycard && !G.vaultOpen) return 'Find the keycard — manager\'s office (top-left)';
  if (!G.vaultOpen) return 'Crack the vault dial (top-right)';
  if (G.lootCount === 0) return 'Grab the loot';
  return 'Get to a getaway van!';
}

/* ---------------- drawing ---------------- */
function drawCone(ox,oy,ang,range,fov,color,blockers){
  const rays = 26;
  ctx.beginPath();
  ctx.moveTo(ox,oy);
  for (let i=0;i<=rays;i++){
    const a = ang - fov/2 + (fov * i/rays);
    const dx = Math.cos(a), dy = Math.sin(a);
    let t = range;
    for (const r of blockers){
      const hit = rayRect(ox,oy,dx,dy,r);
      if (hit < t) t = hit;
    }
    ctx.lineTo(ox + dx*t, oy + dy*t);
  }
  ctx.closePath();
  ctx.fillStyle = color;
  ctx.fill();
}

  /* lasers */
  for (const l of LASERS){
    ctx.fillStyle = '#222'; ctx.fillRect(l.x1-4,l.y1-5,8,10); ctx.fillRect(l.x2-4,l.y2-5,8,10);
    if (G.lasersOff) continue;
    const active = ((G.time + l.phase) % 3.5) < 2.0;
    ctx.strokeStyle = active ? 'rgba(255,40,40,0.95)' : 'rgba(255,40,40,0.18)';
    ctx.lineWidth = active ? 2.5 : 1;
    ctx.setLineDash(active ? [] : [4,5]);
    ctx.beginPath(); ctx.moveTo(l.x1,l.y1); ctx.lineTo(l.x2,l.y2); ctx.stroke();
    ctx.setLineDash([]);
  }
  /* loot */
  for (const l of LOOT){
    if (l.taken) continue;
    if (l.kind === 'gold'){
      ctx.fillStyle = '#e8b91f'; ctx.fillRect(l.x-10,l.y-6,20,12);
      ctx.fillStyle = '#ffe27a'; ctx.fillRect(l.x-10,l.y-6,20,4);
    } else if (l.kind === 'cash'){
      ctx.fillStyle = '#2f9e5f'; ctx.fillRect(l.x-10,l.y-6,20,12);
      ctx.fillStyle = '#bff5d2'; ctx.font = 'bold 10px system-ui'; ctx.textAlign='center';
      ctx.fillText('$', l.x, l.y+4);
    } else {
      ctx.fillStyle = '#57e6ff';
      ctx.beginPath();
      ctx.moveTo(l.x, l.y-9); ctx.lineTo(l.x+8, l.y); ctx.lineTo(l.x, l.y+9); ctx.lineTo(l.x-8, l.y);
      ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#d9fbff'; ctx.fillRect(l.x-2,l.y-3,4,4);
    }
  }
  /* walls */
  ctx.fillStyle = '#0d1017';
  for (const w of WALLS) ctx.fillRect(w.x-2,w.y-2,w.w+4,w.h+4);
  ctx.fillStyle = '#59637c';
  for (const w of WALLS) ctx.fillRect(w.x,w.y,w.w,w.h);
  /* doors */
  for (const d of DOORS){
    if (d.open){
      ctx.fillStyle = 'rgba(120,90,50,0.55)';
      if (d.w > d.h) ctx.fillRect(d.x, d.y-8, 8, 26); else ctx.fillRect(d.x-8, d.y, 26, 8);
    } else {
      ctx.fillStyle = d.locked ? '#7a4a1f' : '#8a5a2b';
      ctx.fillRect(d.x,d.y,d.w,d.h);
      ctx.fillStyle = '#ffd94d';
      const cx = d.x+d.w/2, cy = d.y+d.h/2;
      ctx.fillRect(cx-2,cy-2,4,4);
      if (d.locked){ ctx.fillStyle='#ff6b6b'; ctx.font='9px system-ui'; ctx.textAlign='center'; ctx.fillText('LOCKED', cx, cy-8); }
    }
  }
  /* vault door */
  const vd = VAULT_DOOR;
  if (!G.vaultOpen){
    ctx.fillStyle = '#6e7686'; ctx.fillRect(vd.x, vd.y, vd.w, vd.h);
    const cx = vd.x+vd.w/2, cy = vd.y+vd.h/2;
    ctx.fillStyle = '#454c5c';
    ctx.beginPath(); ctx.arc(cx, cy, 16, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#ffd94d'; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(cx, cy, 16, 0, Math.PI*2); ctx.stroke();
    ctx.beginPath();
    for (let i=0;i<4;i++){
      const a = i*Math.PI/2 + 0.4;
      ctx.moveTo(cx,cy); ctx.lineTo(cx+Math.cos(a)*14, cy+Math.sin(a)*14);
    }
    ctx.stroke();
    if (G.vaultSwing > 0){
      ctx.fillStyle = '#ffd94d'; ctx.font = 'bold 11px system-ui'; ctx.textAlign='center';
      ctx.fillText('OPENING… ' + Math.ceil(G.vaultSwing) + 's', cx, cy-26);
    }
  } else {
    ctx.fillStyle = 'rgba(110,118,134,0.7)';
    ctx.fillRect(vd.x-26, vd.y-4, 24, 18);
  }
  /* vans */
  for (const v of VANS){
    ctx.fillStyle = '#20242e'; ctx.fillRect(v.x-3,v.y-3,v.w+6,v.h+6);
    ctx.fillStyle = '#3d4b63'; ctx.fillRect(v.x,v.y,v.w,v.h);
    ctx.fillStyle = '#5a6d8f'; ctx.fillRect(v.x+6,v.y+5,v.w-34,10);
    ctx.fillStyle = '#ffd94d'; ctx.font = 'bold 11px system-ui'; ctx.textAlign='center';
    ctx.fillText(v.label, v.x+v.w/2, v.y+v.h-8);
    ctx.fillStyle = '#0d1017';
    ctx.beginPath(); ctx.arc(v.x+16,v.y+v.h-2,6,0,Math.PI*2); ctx.arc(v.x+v.w-16,v.y+v.h-2,6,0,Math.PI*2); ctx.fill();
  }
}

function drawEntities(attract){
  const blockers = sightBlockers(G.player.crouch);
  /* camera cones */
  for (const c of G.cams){
    const off = G.camsLooped || G.jamT > 0;
    if (!off) drawCone(c.x,c.y,c.ang,c.range,c.fov,'rgba(255,210,80,0.13)', blockers);
    ctx.fillStyle = off ? '#555' : '#d8d8d8';
    ctx.fillRect(c.x-5,c.y-5,10,10);
    ctx.fillStyle = off ? '#888' : '#ff4040';
    ctx.beginPath(); ctx.arc(c.x,c.y,2.5,0,Math.PI*2); ctx.fill();
  }
  /* guard cones */
  for (const g of G.guards){
    if (g.down) continue;
    const col = g.state==='chase' ? 'rgba(255,60,60,0.22)'
              : (g.state==='investigate'||g.state==='search') ? 'rgba(255,150,50,0.18)'
              : 'rgba(255,220,90,0.15)';
    drawCone(g.x,g.y,g.ang,185,1.05,col, blockers);
  }
  /* smoke */
  if (G.smokeT > 0){
    ctx.fillStyle = 'rgba(200,208,224,0.35)';
    for (let i=0;i<7;i++){
      const a = i*0.9 + G.time*0.7;
      ctx.beginPath();
      ctx.arc(G.smokeX + Math.cos(a)*34, G.smokeY + Math.sin(a)*22, 30 + 8*Math.sin(G.time*2+i), 0, Math.PI*2);
      ctx.fill();
    }
  }
  /* coin projectile */
  if (G.coinProj){
    ctx.fillStyle = '#ffd94d';
    ctx.beginPath(); ctx.arc(G.coinProj.x, G.coinProj.y, 4, 0, Math.PI*2); ctx.fill();
  }
  /* guards */
  for (const g of G.guards){
    if (g.down){
      ctx.save(); ctx.translate(g.x,g.y); ctx.rotate(g.ang);
      ctx.fillStyle = '#2c4a7a'; ctx.fillRect(-13,-6,26,12);
      ctx.fillStyle = '#e8c39a'; ctx.beginPath(); ctx.arc(15,0,5,0,Math.PI*2); ctx.fill();
      ctx.restore();
      ctx.fillStyle = '#9fb4ff'; ctx.font = 'bold 11px system-ui'; ctx.textAlign='center';
      ctx.fillText('z z', g.x, g.y-14);
      continue;
    }
    ctx.fillStyle = '#2c4a7a';
    ctx.beginPath(); ctx.arc(g.x,g.y,10,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#1d3357';
    ctx.beginPath(); ctx.arc(g.x,g.y,6,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#e8c39a';
    ctx.beginPath(); ctx.arc(g.x+Math.cos(g.ang)*5, g.y+Math.sin(g.ang)*5, 4, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#ffd94d'; ctx.fillRect(g.x-1.5,g.y-1.5,3,3);
    if (g.state === 'chase'){
      ctx.fillStyle = '#ff4040'; ctx.font = 'bold 16px system-ui'; ctx.textAlign='center';
      ctx.fillText('!', g.x, g.y-16);
    } else if (g.state === 'investigate' || g.state === 'search'){
      ctx.fillStyle = '#ffb347'; ctx.font = 'bold 14px system-ui'; ctx.textAlign='center';
      ctx.fillText('?', g.x, g.y-16);
    }
  }
  /* thief */
  if (!attract){
    const p = G.player;
    const r = p.crouch ? 8 : 10;
    ctx.fillStyle = p.crouch ? '#15181f' : '#232833';
    ctx.beginPath(); ctx.arc(p.x,p.y,r,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#0b0d12';
    ctx.beginPath(); ctx.arc(p.x,p.y,r*0.6,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#e8c39a';
    ctx.beginPath(); ctx.arc(p.x+Math.cos(p.ang)*5, p.y+Math.sin(p.ang)*5, 3.5, 0, Math.PI*2); ctx.fill();
    if (G.weight > 0){
      ctx.fillStyle = '#6b563a';
      ctx.beginPath(); ctx.arc(p.x-Math.cos(p.ang)*8, p.y-Math.sin(p.ang)*8, 4 + G.weight/8, 0, Math.PI*2); ctx.fill();
    }
    /* interact prompt */
    const t = nearestInteract();
    if (t && !G.dial){
      ctx.fillStyle = 'rgba(0,0,0,0.65)';
      const label = (t.kind==='pick'||t.kind==='channel') ? 'Hold E — ' + t.label : 'E — ' + t.label;
      ctx.font = '12px system-ui';
      const wdt = ctx.measureText(label).width + 16;
      ctx.fillRect(p.x-wdt/2, p.y-44, wdt, 20);
      ctx.fillStyle = '#fff'; ctx.textAlign='center';
      ctx.fillText(label, p.x, p.y-30);
    }
    /* channel bar */
    if (G.channel){
      const wdt = 90;
      ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(p.x-wdt/2, p.y-28, wdt, 8);
      ctx.fillStyle = '#9fe8a9'; ctx.fillRect(p.x-wdt/2, p.y-28, wdt*(G.channel.t/G.channel.dur), 8);
    }
  }
  /* particles & floaters */
  for (const pt of G.particles){
    ctx.globalAlpha = 1 - pt.t/pt.life;
    ctx.fillStyle = pt.color;
    ctx.fillRect(pt.x-2, pt.y-2, 4, 4);
  }
  ctx.globalAlpha = 1;
  ctx.font = 'bold 13px system-ui'; ctx.textAlign='center';
  for (const f of G.floaters){
    ctx.globalAlpha = clamp(1.4 - f.t, 0, 1);
    ctx.fillStyle = f.color;
    ctx.fillText(f.text, f.x, f.y);
  }
  ctx.globalAlpha = 1;
}

function drawHUD(){
  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(0,0,W,44);
  ctx.fillStyle = '#ffd94d'; ctx.font = 'bold 20px system-ui';
  ctx.fillText(fmt$(G.money), 14, 28);
  ctx.fillStyle = '#fff'; ctx.font = '13px system-ui';
  ctx.fillText('LOOT ' + G.weight + '/' + G.capacity + ' kg', 14, 40);
  /* alarm bar */
  ctx.fillStyle = '#fff'; ctx.font = 'bold 12px system-ui';
  ctx.fillText('ALARM', 200, 18);
  ctx.fillStyle = '#333a4d'; ctx.fillRect(200, 22, 180, 12);
  const frac = G.alarmOn ? 1 : G.alarm/100;
  ctx.fillStyle = G.alarmOn ? '#ff2020' : (frac > 0.6 ? '#ff8c1a' : '#ffd94d');
  ctx.fillRect(200, 22, 180*frac, 12);
  if (G.alarmOn && Math.sin(G.time*8) > 0){
    ctx.fillStyle = '#ff2020'; ctx.fillText('TRIGGERED', 200, 44);
  }
  /* objective */
  ctx.textAlign = 'center';
  ctx.fillStyle = '#cfe0ff'; ctx.font = 'bold 15px system-ui';
  ctx.fillText(objective(), W/2+40, 28);
  /* police timer */
  ctx.textAlign = 'right';
  if (G.alarmOn){
    ctx.fillStyle = G.police < 12 ? '#ff4040' : '#ffb347';
    ctx.font = 'bold 18px system-ui';
    ctx.fillText('POLICE ' + Math.ceil(G.police) + 's', W-14, 28);
  } else {
    ctx.fillStyle = '#8fa3c8'; ctx.font = 'bold 14px system-ui';
    ctx.fillText('NO POLICE', W-14, 28);
  }
  /* bottom line: tools */
  ctx.textAlign = 'left';
  ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(0,H-26,W,26);
  ctx.fillStyle = '#dfe7ff'; ctx.font = '13px system-ui';
  const parts = ['Coins ' + G.coins + ' (Q)'];
  if (G.loadout.has('baton')) parts.push('Baton (F)');
  else parts.push('Takedown from behind (F)');
  if (G.loadout.has('lockpick')) parts.push('Lockpicks');
  if (G.loadout.has('jammer')) parts.push('Jammer (J)' + (G.jamT>0 ? ' ' + Math.ceil(G.jamT) + 's' : G.jammerUsed ? ' spent' : ''));
  if (G.loadout.has('smoke')) parts.push('Smoke (X) x' + G.smokeLeft);
  if (G.hasKeycard) parts.push('KEYCARD');
  parts.push('Time ' + Math.floor(G.runTime/60) + ':' + String(Math.floor(G.runTime%60)).padStart(2,'0'));
  ctx.fillText(parts.join(' · '), 14, H-9);
  /* transient message */
  if (G.msgT > 0){
    ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(0,0,0,0.6)';
    ctx.font = 'bold 15px system-ui';
    const wdt = ctx.measureText(G.msg).width + 24;
    ctx.fillRect(W/2-wdt/2, 52, wdt, 26);
    ctx.fillStyle = '#fff';
    ctx.fillText(G.msg, W/2, 70);
  }
}

function drawDial(){
  const d = G.dial; if (!d) return;
  const cx = W/2, cy = H/2, R = 120;
  ctx.fillStyle = 'rgba(4,6,12,0.72)'; ctx.fillRect(0,0,W,H);
  ctx.fillStyle = '#454c5c';
  ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2); ctx.fill();
  ctx.strokeStyle = '#ffd94d'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.arc(cx,cy,R,0,Math.PI*2); ctx.stroke();
  /* green zone */
  ctx.strokeStyle = '#3aff7a'; ctx.lineWidth = 16;
  ctx.beginPath(); ctx.arc(cx,cy,R-14, d.zoneStart, d.zoneStart + d.sizes[d.tumbler]); ctx.stroke();
  /* ticks */
  ctx.strokeStyle = '#cfd6e4'; ctx.lineWidth = 2;
  for (let i=0;i<24;i++){
    const a = i*Math.PI/12;
    ctx.beginPath();
    ctx.moveTo(cx+Math.cos(a)*(R-26), cy+Math.sin(a)*(R-26));
    ctx.lineTo(cx+Math.cos(a)*(R-34), cy+Math.sin(a)*(R-34));
    ctx.stroke();
  }
  /* needle */
  ctx.strokeStyle = '#ff4040'; ctx.lineWidth = 4;
  ctx.beginPath(); ctx.moveTo(cx,cy);
  ctx.lineTo(cx+Math.cos(d.needle)*(R-10), cy+Math.sin(d.needle)*(R-10)); ctx.stroke();
  ctx.fillStyle = '#ffd94d';
  ctx.beginPath(); ctx.arc(cx,cy,9,0,Math.PI*2); ctx.fill();
  ctx.fillStyle = '#fff'; ctx.font = 'bold 20px system-ui'; ctx.textAlign='center';
  ctx.fillText('TUMBLER ' + (d.tumbler+1) + ' / 3 — SPACE or CLICK in the green', cx, cy+R+36);
  for (let i=0;i<3;i++){
    ctx.fillStyle = i < d.tumbler ? '#3aff7a' : '#39415a';
    ctx.beginPath(); ctx.arc(cx-24+i*24, cy+R+58, 8, 0, Math.PI*2); ctx.fill();
  }
}

/* plan screen layout */
const PLAN = {
  bx:30, by:110, s:0.6,
  panelX:630, panelW:310,
  entryY:[150,206,262], entryH:48,
  loadY:352, loadH:34,
  start:{x:630,y:545,w:310,h:52},
};
function planClick(mx,my){
  for (let i=0;i<3;i++){
    if (mx>=PLAN.panelX && mx<=PLAN.panelX+PLAN.panelW && my>=PLAN.entryY[i] && my<=PLAN.entryY[i]+PLAN.entryH){
      G.entry = i; SFX.click(); return;
    }
  }
  for (let i=0;i<LOADOUT.length;i++){
    const y = PLAN.loadY + i*PLAN.loadH;
    if (mx>=PLAN.panelX && mx<=PLAN.panelX+PLAN.panelW && my>=y && my<=y+PLAN.loadH-4){
      toggleLoadout(LOADOUT[i].id); return;
    }
  }
  const s = PLAN.start;
  if (mx>=s.x && mx<=s.x+s.w && my>=s.y && my<=s.y+s.h) startJob();
}
function drawPlan(){
  ctx.fillStyle = '#0a1a3a'; ctx.fillRect(0,0,W,H);
  ctx.textAlign = 'left';
  ctx.fillStyle = '#cfe0ff'; ctx.font = 'bold 24px system-ui';
  ctx.fillText('THE PLAN — MERIDIAN BANK, 2:47 AM', 30, 44);
  ctx.fillStyle = '#8fa3c8'; ctx.font = '14px system-ui';
  ctx.fillText('Pick an entry point and 2 tools. Then we move.', 30, 68);
  /* blueprint */
  const {bx,by,s} = PLAN;
  ctx.strokeStyle = '#3d5a99'; ctx.lineWidth = 2;
  ctx.strokeRect(bx-6, by-6, W*s+12, H*s+12);
  ctx.fillStyle = '#0d2150'; ctx.fillRect(bx,by,W*s,H*s);
  const P = (x,y)=>[bx + x*s, by + y*s];
  ctx.fillStyle = '#7fa8e8';
  for (const w of WALLS){ const [x,y]=P(w.x,w.y); ctx.fillRect(x,y,w.w*s,w.h*s); }
  for (const d of DOORS){ const [x,y]=P(d.x,d.y); ctx.fillStyle = d.locked ? '#ff9d5c' : '#7fa8e8'; ctx.fillRect(x,y,d.w*s,d.h*s); }
  /* patrol routes */
  ctx.strokeStyle = '#ffd94d'; ctx.setLineDash([5,5]); ctx.lineWidth = 1.5;
  for (const g of makeGuards()){
    ctx.beginPath();
    g.path.forEach((wp,i)=>{ const [x,y]=P(wp[0],wp[1]); i===0 ? ctx.moveTo(x,y) : ctx.lineTo(x,y); });
    ctx.closePath(); ctx.stroke();
  }
  ctx.setLineDash([]);
  /* camera cones */
  for (const c of makeCams()){
    const [x,y]=P(c.x,c.y);
    ctx.fillStyle = 'rgba(255,210,80,0.25)';
    ctx.beginPath(); ctx.moveTo(x,y);
    ctx.arc(x,y,c.range*s, c.base-c.fov/2, c.base+c.fov/2);
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#fff'; ctx.fillRect(x-2,y-2,4,4);
  }
  /* vault $ */
  const [vx,vy] = P(790,160);
  ctx.fillStyle = '#ffd94d'; ctx.font = 'bold 26px system-ui'; ctx.textAlign='center';
  ctx.fillText('$', vx, vy);
  ctx.font = '11px system-ui'; ctx.fillText('VAULT', vx, vy+16);
  /* lasers */
  ctx.strokeStyle = '#ff4040'; ctx.lineWidth = 1.5;
  for (const l of LASERS){ const [x1,y1]=P(l.x1,l.y1), [x2,y2]=P(l.x2,l.y2); ctx.beginPath(); ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.stroke(); }
  /* vans */
  ctx.fillStyle = '#9fe8a9'; ctx.font = '10px system-ui';
  for (const v of VANS){ const [x,y]=P(v.x,v.y); ctx.strokeStyle='#9fe8a9'; ctx.strokeRect(x,y,v.w*s,v.h*s); ctx.fillText('VAN', x+v.w*s/2, y+v.h*s/2+3); }
  /* entry markers */
  const marks = [[480,560],[880,290],[170,155]];
  marks.forEach((m,i)=>{
    const [x,y]=P(m[0],m[1]);
    ctx.fillStyle = G.entry===i ? '#ff4040' : '#ffd94d';
    ctx.beginPath(); ctx.arc(x,y,11,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#0a1a3a'; ctx.font = 'bold 13px system-ui';
    ctx.fillText(String(i+1), x, y+4);
  });
  /* legend */
  ctx.textAlign = 'left'; ctx.fillStyle = '#8fa3c8'; ctx.font = '12px system-ui';
  ctx.fillText('— guard patrol   ◣ camera   — laser   ■ locked door', bx, by + H*s + 30);

  /* right panel */
  const px = PLAN.panelX, pw = PLAN.panelW;
  ctx.fillStyle = '#cfe0ff'; ctx.font = 'bold 17px system-ui';
  ctx.fillText('ENTRY POINT', px, 132);
  ENTRIES.forEach((e,i)=>{
    const y = PLAN.entryY[i];
    ctx.fillStyle = G.entry===i ? '#274b8f' : '#12244d';
    ctx.fillRect(px, y, pw, PLAN.entryH);
    ctx.strokeStyle = G.entry===i ? '#ffd94d' : '#3d5a99'; ctx.lineWidth = G.entry===i ? 2 : 1;
    ctx.strokeRect(px, y, pw, PLAN.entryH);
    ctx.fillStyle = '#fff'; ctx.font = 'bold 15px system-ui';
    ctx.fillText(e.name, px+10, y+19);
    ctx.fillStyle = '#a9bde0'; ctx.font = '11px system-ui';
    ctx.fillText(e.desc, px+10, y+37);
  });
  ctx.fillStyle = '#cfe0ff'; ctx.font = 'bold 17px system-ui';
  ctx.fillText('LOADOUT — pick 2 (' + G.loadout.size + '/2)', px, 338);
  LOADOUT.forEach((item,i)=>{
    const y = PLAN.loadY + i*PLAN.loadH;
    const on = G.loadout.has(item.id);
    ctx.fillStyle = on ? '#274b8f' : '#12244d';
    ctx.fillRect(px, y, pw, PLAN.loadH-4);
    ctx.strokeStyle = on ? '#9fe8a9' : '#3d5a99'; ctx.lineWidth = 1;
    ctx.strokeRect(px, y, pw, PLAN.loadH-4);
    ctx.fillStyle = on ? '#9fe8a9' : '#5a6d8f';
    ctx.fillRect(px+8, y+8, 14, 14);
    if (on){ ctx.fillStyle = '#0a1a3a'; ctx.font = 'bold 12px system-ui'; ctx.fillText('✓', px+10, y+20); }
    ctx.fillStyle = '#fff'; ctx.font = 'bold 13px system-ui';
    ctx.fillText(item.name + '  [' + item.key + ']', px+30, y+15);
    ctx.fillStyle = '#a9bde0'; ctx.font = '10.5px system-ui';
    ctx.fillText(item.desc, px+30, y+27);
  });
  /* start button */
  const st = PLAN.start;
  ctx.fillStyle = G.loadout.size===2 ? '#c81f2f' : '#5a2430';
  ctx.fillRect(st.x, st.y, st.w, st.h);
  ctx.strokeStyle = '#ff8a94'; ctx.lineWidth = 2; ctx.strokeRect(st.x, st.y, st.w, st.h);
  ctx.fillStyle = '#fff'; ctx.font = 'bold 22px system-ui'; ctx.textAlign='center';
  ctx.fillText('START THE JOB', st.x+st.w/2, st.y+34);
  ctx.textAlign = 'left';
  if (G.msgT > 0){
    ctx.fillStyle = '#ffb347'; ctx.font = 'bold 14px system-ui';
    ctx.fillText(G.msg, 30, H-18);
  }
}

function drawEnd(){
  drawBank();
  drawEntities(false);
  ctx.fillStyle = 'rgba(4,6,12,0.78)'; ctx.fillRect(0,0,W,H);
  ctx.textAlign = 'center';
  if (G.mode === 'win'){
    ctx.fillStyle = '#ffd94d'; ctx.font = 'bold 64px system-ui';
    ctx.fillText('CLEAN GETAWAY', W/2, 170);
    ctx.fillStyle = '#fff'; ctx.font = '19px system-ui';
    const p = G.scoreParts || {loot:0,ghost:0,silent:0,speed:0};
    ctx.fillText('Loot hauled: ' + fmt$(p.loot), W/2, 230);
    ctx.fillText('Ghost bonus (never seen): ' + fmt$(p.ghost), W/2, 262);
    ctx.fillText('Silent bonus (no alarm): ' + fmt$(p.silent), W/2, 294);
    ctx.fillText('Speed bonus: ' + fmt$(p.speed), W/2, 326);
    ctx.font = 'bold 26px system-ui'; ctx.fillStyle = '#ffd94d';
    ctx.fillText('SCORE ' + fmt$(G.score), W/2, 376);
    ctx.font = 'bold 80px system-ui';
    ctx.fillStyle = G.rank==='S' ? '#ffd94d' : G.rank==='A' ? '#9fe8a9' : '#cfe0ff';
    ctx.fillText(G.rank, W/2, 466);
    ctx.font = '16px system-ui'; ctx.fillStyle = '#8fa3c8';
    ctx.fillText('Best score: ' + fmt$(G.best), W/2, 500);
  } else {
    ctx.fillStyle = '#ff4040'; ctx.font = 'bold 72px system-ui';
    ctx.fillText('BUSTED', W/2, 200);
    ctx.fillStyle = '#fff'; ctx.font = '20px system-ui';
    ctx.fillText(G.bustReason, W/2, 250);
    ctx.font = '16px system-ui'; ctx.fillStyle = '#8fa3c8';
    ctx.fillText('Loot left behind: ' + fmt$(G.money) + ' · Time: ' + Math.floor(G.runTime/60) + ':' + String(Math.floor(G.runTime%60)).padStart(2,'0'), W/2, 290);
    ctx.fillText('Best score: ' + fmt$(G.best), W/2, 320);
  }
  ctx.fillStyle = '#ff6b6b'; ctx.font = 'bold 20px system-ui';
  ctx.fillText('ENTER — back to the plan', W/2, 560);
}

function draw(){
  ctx.save();
  if (G.shake > 0) ctx.translate(rand(-G.shake,G.shake), rand(-G.shake,G.shake));
  if (G.mode === 'title') drawTitle();
  else if (G.mode === 'plan') drawPlan();
  else if (G.mode === 'win' || G.mode === 'busted') drawEnd();
  else {
    drawBank();
    drawEntities(false);
    drawHUD();
    if (G.dial) drawDial();
    if (G.paused){
      ctx.fillStyle = 'rgba(4,6,12,0.7)'; ctx.fillRect(0,0,W,H);
      ctx.fillStyle = '#fff'; ctx.font = 'bold 40px system-ui'; ctx.textAlign='center';
      ctx.fillText('PAUSED', W/2, H/2);
      ctx.font = '16px system-ui'; ctx.fillStyle = '#8fa3c8';
      ctx.fillText('P or Esc to resume · R back to plan', W/2, H/2+34);
    }
  }
  ctx.restore();
}

/* ---------------- main loop ---------------- */
let lastT = performance.now();
function frame(now){
  let dt = (now - lastT) / 1000;
  lastT = now;
  dt = clamp(dt, 0, 0.05);
  update(dt);
  draw();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
